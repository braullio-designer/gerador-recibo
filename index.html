<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gerador de Recibo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap');

:root {
  --bg: #0c0c0c;
  --card: #141414;
  --border: #2c2c2c;
  --acc: #f0d060;
  --acc-dim: rgba(240,208,96,0.1);
  --text: #e8e8e8;
  --muted: #555;
  --red: #e05555;
  --green: #55c888;
  --r: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding-bottom: 110px;
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(12,12,12,0.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.badge {
  background: var(--acc); color: #000;
  font-family: 'DM Mono', monospace;
  font-size: 8px; font-weight: 700;
  letter-spacing: 2px; padding: 4px 8px; border-radius: 4px;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

/* FORM */
.form-wrap { padding: 24px 20px; }

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--acc); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; padding: 14px 16px;
  border-radius: var(--r); outline: none;
  transition: border-color .15s;
  -webkit-appearance: none;
}
.field input:focus { border-color: var(--acc); }
.field input::placeholder { color: var(--muted); font-size: 14px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* LOGO UPLOAD */
.logo-box {
  border: 1.5px dashed var(--border);
  border-radius: var(--r);
  padding: 28px 20px;
  text-align: center;
  background: var(--card);
  cursor: pointer;
  transition: border-color .15s;
  position: relative;
  display: block;
  touch-action: manipulation;
}
.logo-box:active { border-color: var(--acc); }
.logo-box-icon { font-size: 30px; margin-bottom: 8px; }
.logo-box-txt {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 1px;
  color: var(--muted); text-transform: uppercase;
}
.logo-preview {
  max-height: 80px; max-width: 180px;
  object-fit: contain; filter: grayscale(1);
  display: none; margin: 0 auto;
}

/* TOGGLE */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px;
  margin-bottom: 10px; cursor: pointer; user-select: none;
  touch-action: manipulation; min-height: 54px;
  transition: border-color .15s;
}
.toggle-row.active { border-color: var(--acc); background: var(--acc-dim); }
.toggle-label { font-size: 14px; font-weight: 500; }
.toggle-row.active .toggle-label { color: var(--acc); }
.toggle-sw {
  width: 42px; height: 24px;
  background: var(--border); border-radius: 12px;
  position: relative; transition: background .2s; flex-shrink: 0;
}
.toggle-row.active .toggle-sw { background: var(--acc); }
.toggle-sw::after {
  content: ''; position: absolute;
  width: 18px; height: 18px; background: #fff;
  border-radius: 50%; top: 3px; left: 3px;
  transition: transform .2s;
}
.toggle-row.active .toggle-sw::after { transform: translateX(18px); }

/* QUANTIDADE */
.qty-selector {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-bottom: 14px;
}
.qty-btn {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--r);
  padding: 12px; text-align: center;
  font-family: 'DM Mono', monospace; font-size: 13px;
  cursor: pointer; touch-action: manipulation;
  transition: all .15s; user-select: none;
}
.qty-btn.active { border-color: var(--acc); background: var(--acc-dim); color: var(--acc); }

/* BOTTOM */
.bottom-cta {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
  padding: 12px 20px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: rgba(12,12,12,0.97);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
}
.btn-gerar {
  width: 100%; background: var(--acc); color: #000;
  border: none; border-radius: var(--r);
  font-family: 'DM Mono', monospace; font-weight: 700;
  font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase;
  padding: 18px; cursor: pointer;
  touch-action: manipulation; -webkit-appearance: none;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 56px; user-select: none;
  transition: opacity .15s;
}
.btn-gerar:active { opacity: .8; }
.btn-gerar:disabled { opacity: .35; }

/* STATUS */
.status-toast {
  position: fixed; bottom: 88px; left: 20px; right: 20px; z-index: 80;
  padding: 12px 18px; border-radius: var(--r);
  font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px;
  text-align: center; opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.status-toast.show { opacity: 1; }
.status-toast.ok  { background:#0d2e1a; border:1px solid var(--green); color:var(--green); }
.status-toast.err { background:#2e0d0d; border:1px solid var(--red);   color:var(--red); }
.status-toast.loading { background:#1a1a08; border:1px solid var(--acc); color:var(--acc); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="badge">PRO</div>
    <div class="header-title">Gerador de Recibo</div>
  </div>
  <div class="header-sub">v3.1</div>
</div>

<div class="form-wrap">

  <div class="section-label">Dados da empresa</div>

  <div class="field">
    <label>Nome da empresa *</label>
    <input type="text" id="emp-nome" placeholder="Ex: Chaveiro Rey">
  </div>

  <div class="field">
    <label>Serviços / Slogan</label>
    <input type="text" id="emp-servico" placeholder="Ex: Serviços Automotivo">
  </div>

  <div class="grid-2">
    <div class="field">
      <label>WhatsApp</label>
      <input type="tel" id="emp-fone" placeholder="(82) 99999-0000">
    </div>
    <div class="field">
      <label>CNPJ / CPF</label>
      <input type="text" id="emp-cnpj" placeholder="00.000.000/0001-00">
    </div>
  </div>

  <div class="field">
    <label>Endereço</label>
    <input type="text" id="emp-end" placeholder="Rua, Nº, Bairro, Cidade">
  </div>

  <div class="section-label" style="margin-top:8px">Logo da empresa</div>

  <label class="logo-box" for="logo-file">
    <input type="file" id="logo-file" accept="image/*" onchange="loadLogo(event)"
      style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <div class="logo-box-icon" id="logo-icon">🖼️</div>
    <div class="logo-box-txt" id="logo-txt">Toque para adicionar logo</div>
    <img id="logo-preview" class="logo-preview">
  </label>

  <div style="margin-top:10px">
    <div class="toggle-row" id="tog-sem" onclick="setLogo('nenhuma')">
      <span class="toggle-label">Sem logo</span>
      <div class="toggle-sw"></div>
    </div>
    <div class="toggle-row active" id="tog-com" onclick="setLogo('upload')">
      <span class="toggle-label">Com logo</span>
      <div class="toggle-sw"></div>
    </div>
  </div>

  <div class="section-label" style="margin-top:24px">Quantidade de vias</div>

  <div class="qty-selector">
    <div class="qty-btn active" onclick="setVias(1,this)">1 via</div>
    <div class="qty-btn" onclick="setVias(2,this)">2 vias</div>
    <div class="qty-btn" onclick="setVias(3,this)">3 vias</div>
  </div>

  <div class="section-label" style="margin-top:8px">Opções do template</div>

  <div class="toggle-row active" id="tog-veiculo" onclick="toggleOpt('veiculo')">
    <span class="toggle-label">Incluir campos Veículo / Placa</span>
    <div class="toggle-sw"></div>
  </div>

</div>

<div class="bottom-cta">
  <button class="btn-gerar" id="btn-gerar" onclick="gerarPDF()">
    ↓ Gerar Recibo em PDF
  </button>
</div>

<div class="status-toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

let logoSrc = null;
let logoOpt = 'upload';
let vias = 1;
let opts = { veiculo: true };

function get(id){ return document.getElementById(id)?.value?.trim() || ''; }

function n(str){
  if(!str) return '';
  let s = String(str);
  s = s.replace(/[àáâãä]/g,'a').replace(/[ÀÁÂÃÄ]/g,'A');
  s = s.replace(/[èéêë]/g,'e').replace(/[ÈÉÊË]/g,'E');
  s = s.replace(/[ìíîï]/g,'i').replace(/[ÌÍÎÏ]/g,'I');
  s = s.replace(/[òóôõö]/g,'o').replace(/[ÒÓÔÕÖ]/g,'O');
  s = s.replace(/[ùúûü]/g,'u').replace(/[ÙÚÛÜ]/g,'U');
  s = s.replace(/[ç]/g,'c').replace(/[Ç]/g,'C');
  s = s.replace(/[^\x00-\x7F]/g,'');
  return s;
}

function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'status-toast show ' + type;
  if(type !== 'loading') setTimeout(()=>el.classList.remove('show'), 3000);
}

function loadLogo(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    logoSrc = ev.target.result;
    const img = document.getElementById('logo-preview');
    img.src = logoSrc; img.style.display = 'block';
    document.getElementById('logo-icon').style.display = 'none';
    document.getElementById('logo-txt').style.display = 'none';
    setLogo('upload');
  };
  r.readAsDataURL(file);
}

function setLogo(opt){
  logoOpt = opt;
  document.getElementById('tog-sem').classList.toggle('active', opt==='nenhuma');
  document.getElementById('tog-com').classList.toggle('active', opt==='upload');
}

function setVias(n, el){
  vias = n;
  document.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

function toggleOpt(key){
  opts[key] = !opts[key];
  document.getElementById('tog-'+key).classList.toggle('active', opts[key]);
}

// Touch support
document.getElementById('tog-sem').addEventListener('touchend', e=>{e.preventDefault();setLogo('nenhuma');},{passive:false});
document.getElementById('tog-com').addEventListener('touchend', e=>{e.preventDefault();setLogo('upload');},{passive:false});
document.getElementById('tog-veiculo').addEventListener('touchend', e=>{e.preventDefault();toggleOpt('veiculo');},{passive:false});
document.getElementById('btn-gerar').addEventListener('touchend', e=>{e.preventDefault();gerarPDF();},{passive:false});
document.querySelectorAll('.qty-btn').forEach((btn,i)=>{
  btn.addEventListener('touchend', e=>{
    e.preventDefault();
    setVias(i+1, btn);
  },{passive:false});
});

// ── GERAR PDF ────────────────────────────────────────────────
async function gerarPDF(){
  const empNome = get('emp-nome');
  if(!empNome){ toast('Preencha o nome da empresa', 'err'); return; }

  const btn = document.getElementById('btn-gerar');
  btn.disabled = true;
  toast('Gerando PDF...', 'loading');

  try{
    const {jsPDF} = window.jspdf;

    // Uma página por via
    const doc = new jsPDF({unit:'mm', format:[100,150], orientation:'portrait'});

    for(let via=0; via < vias; via++){
      if(via > 0) doc.addPage([100,150]);
      desenharRecibo(doc, via+1);
    }

    const nome = 'recibo_' + n(empNome).toLowerCase().replace(/\s+/g,'_') + '.pdf';
    doc.save(nome);
    toast('PDF baixado!', 'ok');

  } catch(err){
    toast('Erro: ' + err.message, 'err');
    console.error(err);
  }

  btn.disabled = false;
}

function desenharRecibo(doc, via){
  const W=100, H=150, ml=3, cw=94;

  // Borda externa
  doc.setLineWidth(0.5);
  doc.rect(ml, 2, cw, H-4);

  // ── CABEÇALHO — 2/3 info | 1/3 logo ──────────────────
  const cabTop = 3;
  const infoW  = cw * (2/3);   // ~63mm
  const logoW  = cw * (1/3);   // ~31mm
  const cx     = ml + infoW/2; // centro do bloco info
  const maxW   = infoW - 4;    // largura máxima do texto

  const empNome = get('emp-nome');
  const empS    = get('emp-servico');
  const ef      = get('emp-fone');
  const ec      = get('emp-cnpj');
  const ee      = get('emp-end');

  // Altura fixa por linha — cada info ocupa 1 linha garantida
  const LH_NOME = 6;   // altura linha nome
  const LH_SVC  = 4.5; // altura linha serviço (pode ter 2 linhas)
  const LH_CONT = 3.5; // altura linha contato
  const LH_END  = 3.5; // altura linha endereço
  const PAD     = 3;   // padding top+bottom

  let cabH = PAD + LH_NOME;
  if(empS)    cabH += LH_SVC;
  if(ef||ec)  cabH += LH_CONT;
  if(ee)      cabH += LH_END;
  cabH += PAD;
  cabH = Math.max(cabH, 22);

  // Linha fundo cabeçalho
  doc.setLineWidth(0.5);
  doc.line(ml, cabTop+cabH, ml+cw, cabTop+cabH);

  // Divisória vertical info | logo
  doc.setLineWidth(0.4);
  doc.line(ml+infoW, cabTop, ml+infoW, cabTop+cabH);

  // Posição Y inicial — centralizado verticalmente
  let totalH = LH_NOME;
  if(empS)   totalH += LH_SVC;
  if(ef||ec) totalH += LH_CONT;
  if(ee)     totalH += LH_END;
  let iy = cabTop + (cabH - totalH) / 2 + LH_NOME - 1;

  // ── NOME — Helvetica Bold (Poppins não disponível no jsPDF padrão)
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.text(n(empNome).toUpperCase(), cx, iy, {align:'center', maxWidth:maxW});
  iy += LH_NOME;

  // ── SERVIÇO — até 100 chars, quebra em até 2 linhas se necessário
  if(empS){
    doc.setFont('helvetica','bold');
    doc.setFontSize(6);
    let svcStr = n(empS).toUpperCase();
    // Divide em 2 linhas se necessário
    const svcLines = doc.splitTextToSize(svcStr, maxW);
    const linhasUsadas = Math.min(svcLines.length, 2);
    doc.text(svcLines.slice(0,2), cx, iy, {align:'center'});
    iy += LH_SVC * linhasUsadas;
  }

  // ── FONE + CNPJ — WhatsApp icon + fone esquerda, cnpj direita
  if(ef || ec){
    doc.setFont('helvetica','bold');
    doc.setFontSize(6);
    if(ef && ec){
      // Bolinha preta
      doc.setFillColor(0,0,0);
      doc.circle(ml+3, iy-1.3, 1.6, 'F');
      // Telefone branco dentro — quadrado branco simbolizando aparelho
      doc.setFillColor(255,255,255);
      // Corpo do fone (retangulo pequeno)
      doc.roundedRect(ml+1.8, iy-2.4, 2.4, 2.2, 0.3, 0.3, 'F');
      // Tela preta dentro
      doc.setFillColor(0,0,0);
      doc.rect(ml+2.1, iy-2.1, 1.8, 1.3, 'F');
      doc.setFillColor(0,0,0);
      doc.setTextColor(0,0,0);
      doc.setFontSize(6);
      doc.setFont('helvetica','bold');
      doc.text(n(ef), ml+5.8, iy);
      doc.text('CNPJ/CPF: '+n(ec), ml+infoW-2, iy, {align:'right'});
    } else if(ef){
      doc.setFillColor(0,0,0);
      doc.circle(ml+3, iy-1.3, 1.6, 'F');
      doc.setFillColor(255,255,255);
      doc.roundedRect(ml+1.8, iy-2.4, 2.4, 2.2, 0.3, 0.3, 'F');
      doc.setFillColor(0,0,0);
      doc.rect(ml+2.1, iy-2.1, 1.8, 1.3, 'F');
      doc.setFillColor(0,0,0);
      doc.setTextColor(0,0,0);
      doc.setFontSize(6);
      doc.setFont('helvetica','bold');
      doc.text(n(ef), ml+5.8, iy);
    } else {
      doc.text('CNPJ/CPF: '+n(ec), cx, iy, {align:'center'});
    }
    iy += LH_CONT;
  }

  // ── ENDEREÇO — fonte menor, 1 linha
  if(ee){
    doc.setFont('helvetica','normal');
    doc.setFontSize(5);
    let endStr = n(ee);
    while(doc.getTextWidth(endStr) > maxW && endStr.length > 5){
      endStr = endStr.slice(0, -4) + '...';
    }
    doc.text(endStr, cx, iy, {align:'center'});
  }

  // ── LOGO no bloco 1/3
  if(logoOpt==='upload' && logoSrc){
    try{
      const lx = ml + infoW + 2;
      const ly = cabTop + 2;
      const lw = logoW - 4;
      const lh = cabH - 4;
      doc.addImage(logoSrc, 'JPEG', lx, ly, lw, lh, '', 'FAST');
    } catch(e){}
  }

  let y = cabTop + cabH + 3;

  // ── BLOCO 2 — VALIDO COMO RECIBO ──────────────────────
  // Linhas extras se tiver veículo
  const linhasBloco2 = opts.veiculo ? 5 : 4;
  const b2h = linhasBloco2 * 5 + 2;

  doc.setLineWidth(0.4);
  doc.rect(ml, y, cw, b2h);

  let by = y + 4;

  // Título
  doc.setFont('helvetica','bold'); doc.setFontSize(7);
  doc.text('VALIDO COMO RECIBO/ORCAMENTO', ml+cw/2, by, {align:'center'});
  by += 5;

  // Data + Fone
  doc.setFontSize(6.5);
  doc.text('Data:', ml+2, by);
  doc.line(ml+9, by+0.5, ml+36, by+0.5);
  doc.text('Fone:', ml+38, by);
  doc.line(ml+45, by+0.5, ml+cw-2, by+0.5);
  by += 5;

  // Cliente
  doc.text('Cliente:', ml+2, by);
  doc.line(ml+14, by+0.5, ml+cw-2, by+0.5);
  by += 5;

  // Endereço cliente
  doc.text('End.:', ml+2, by);
  doc.line(ml+10, by+0.5, ml+cw-2, by+0.5);
  by += 5;

  // Veículo + Placa (opcional)
  if(opts.veiculo){
    doc.text('Veiculo:', ml+2, by);
    doc.line(ml+14, by+0.5, ml+56, by+0.5);
    doc.text('Placa:', ml+58, by);
    doc.line(ml+66, by+0.5, ml+cw-2, by+0.5);
    by += 5;
  }

  y = y + b2h + 2;

  // ── TABELA — 20 linhas, 4 colunas ─────────────────────
  const colQ=10, colVU=20, colVT=18, colD=cw-colQ-colVU-colVT;
  const thH=5, tdH=4.5;

  // Header da tabela
  doc.setLineWidth(0.4);
  doc.rect(ml, y, cw, thH);
  [colQ, colQ+colD, colQ+colD+colVU].forEach(x=>
    doc.line(ml+x, y, ml+x, y+thH)
  );

  doc.setFont('helvetica','bold'); doc.setFontSize(6);
  doc.text('Qtd',          ml+colQ/2,                 y+3.3, {align:'center'});
  doc.text('Discriminacao', ml+colQ+colD/2,             y+3.3, {align:'center'});
  doc.text('V. Unit.',     ml+colQ+colD+colVU/2,        y+3.3, {align:'center'});
  doc.text('V. Total',     ml+colQ+colD+colVU+colVT/2,  y+3.3, {align:'center'});
  y += thH;

  // 20 linhas em branco
  doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setLineWidth(0.15);
  for(let i=0; i<20; i++){
    doc.line(ml, y+tdH, ml+cw, y+tdH);
    [0, colQ, colQ+colD, colQ+colD+colVU, cw].forEach(x=>
      doc.line(ml+x, y, ml+x, y+tdH)
    );
    y += tdH;
  }

  // ── TOTAL ──────────────────────────────────────────────
  const totH = 6;
  doc.setLineWidth(0.4);
  doc.rect(ml, y, cw, totH);
  doc.line(ml+colQ+colD+colVU, y, ml+colQ+colD+colVU, y+totH);
  doc.setFont('helvetica','bold'); doc.setFontSize(7);
  doc.text('TOTAL R$', ml+colQ+colD+colVU-2, y+4, {align:'right'});
  y += totH + 5;

  // ── RODAPÉ ─────────────────────────────────────────────
  doc.setLineWidth(0.3);
  doc.line(ml+1, y+2, ml+30, y+2);
  doc.setFont('helvetica','normal'); doc.setFontSize(5.5);
  doc.text('ASSINATURA', ml+15, y+5.5, {align:'center'});
  doc.setFont('helvetica','bold');
  doc.text('AGRADECEMOS',  ml+cw-1, y+2,   {align:'right'});
  doc.text('A PREFERENCIA', ml+cw-1, y+5.5, {align:'right'});

  // Número da via (se mais de 1)
  if(vias > 1){
    doc.setFontSize(5); doc.setFont('helvetica','normal');
    doc.text('Via '+via+'/'+vias, ml+cw/2, y+5.5, {align:'center'});
  }
}
</script>
</body>
</html>
